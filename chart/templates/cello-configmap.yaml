kind: ConfigMap
apiVersion: v1
metadata:
  name: cello-config
  namespace: kube-system
data:
  conf: |
    {
      "subnets": [
        {{- $lastSubnet := sub (len .Values.cello.subnetIDs) 1}}
        {{- range $idx,$item := .Values.cello.subnetIDs }}
        {{ quote $item }}{{ if ne $idx $lastSubnet }},{{end}}
        {{- end}}
      ],
      "securityGroups": [
        {{- $lastSG := sub (len .Values.cello.securityGroupIDs) 1}}
        {{- range $idx,$item := .Values.cello.securityGroupIDs }}
        {{ quote $item }}{{ if ne $idx $lastSG }},{{end}}
        {{- end}}
      ],
      {{- if .Values.cello.iamRole }}
      "ramRole": "{{.Values.cello.iamRole | quote }}",
      {{- end }}
      interfaceTagPrefixes: [
        {{- $lastPrefix := sub (len .Values.cello.interfaceTagPrefixes) 1}}
        {{- range $idx,$item := .Values.cello.interfaceTagPrefixes }}
        {{ quote $item }}{{ if ne $idx $lastPrefix }},{{end}}
        {{- end}}
      ],
      additionalTags: [
        {{- $lastTag := sub (len .Values.cello.additionalTags) 1}}
        {{- range $idx,$item := .Values.cello.additionalTags }}
        {{ quote $item }}{{ if ne $idx $lastTag }},{{end}}
        {{- end}}
      ],
      "credentialAccessKeyId": "{{ .Values.cello.accessKey }}",
      "credentialAccessKeySecret": "{{ .Values.cello.secretKey }}",
      "openApiAddress": "{{ .Values.cello.openAPIAddress }}",
      "poolTarget": 3,
      "poolTargetMin": 5,
      "poolMaxCapProbe": true,
      "poolMonitorIntervalSec": 120,
      "networkMode": "eni_shared",
      "ipFamily": "{{ .Values.cello.ipFamily }}",
      "kubeClientQPS": 5.0,
      "kubeClientBurst": 10
    }
  10-cello.conflist: |
    {
      "cniVersion": "0.3.1",
      "name": "cello-chainer",
      "plugins": [
        {
          "type": "cello-cni",
          "capabilities": {
            "bandwidth": true
           },
          "redirectToHostCIDRs": [
            {{- $last := sub (len .Values.cello.redirectToHostCIDRs) 1}}
            {{- range $idx,$item := .Values.cello.redirectToHostCIDRs }}
            {{ quote $item }}{{ if ne $idx $last }},{{end}}
            {{- end}}
          ]
        },
        {
          "type": "cilium-cni"
        }
      ]
    }
